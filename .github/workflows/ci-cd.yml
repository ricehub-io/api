name: CI/CD pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Prime cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

  lint:
    needs: setup
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: fmt --diff

      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  security:
    needs: setup
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      # - name: Run gosec
      #   if: github.ref == 'refs/heads/main'
      #   run: |
      #     go install github.com/securego/gosec/v2/cmd/gosec@v2.26.1
      #     gosec -exclude-generated -conf gosec-config.json ./...

  test:
    needs: setup
    name: Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./... -shuffle=on -timeout=5m ${{ github.ref == 'refs/heads/main' && '-race' || '' }}

